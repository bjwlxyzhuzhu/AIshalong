services:
  aishalong:
    image: ghcr.io/bjwlxyzhuzhu/aishalong:latest
    container_name: aishalong
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - /opt/salon:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
