const navBottom = (label,next,text) => `<div class="panel-bottom"><span class="label">${label}</span><button class="button red" data-panel="${next}">${text}${arrow}</button></div>`;
const templates = {
outline:()=>`<h3 class="section-title">60分钟，<br>从协同思维走向育人实践。</h3><p class="section-lede">面向宝鸡文理学院新进教师。带走一套教研任务拆解方法、两条应用流程，以及一张贯通培养项目图。</p><div class="timeline">${[
 ['00—05′','开场与问题','哪些工作适合人机协同？哪些判断需要教师承担？','contact','作者联系'],
 ['05—20′','人机协同与高校教师教研工作','目标 → 材料 → 分工 → 产出 → 核验','collaboration','进入第一部分'],
 ['20—40′','智能体开发与短视频制作','同一个教学难点，形成课程助教与60秒知识短视频。','practice','进入第二部分'],
 ['40—55′','“教、学、研、赛、用、评”贯通培养','用一个真实问题连接六个环节，并留下学习证据。','integration','进入第三部分'],
 ['55—60′','行动建议与交流','选一个难点，做一个原型，制一条视频，收一轮证据。','worksheet','打开实践工作单']
 ].map(r=>`<div class="timeline-row"><span>${r[0]}</span><div><h3>${r[1]}</h3><p>${r[2]}</p></div><button class="button ghost" data-panel="${r[3]}">${r[4]}</button></div>`).join('')}</div><p class="small-note">术语说明：SI = Superintelligence（超级智能）。本讲座以其发展方向作为前瞻视角，实践部分基于当前可用的生成式AI与智能体技术。</p>${navBottom('讲座主线：理解协同 → 做出应用 → 贯通培养','collaboration','从人机协同开始')}`,
collaboration:()=>`<span class="label">第一部分 · 15分钟</span><h3 class="section-title" style="margin-top:15px">让AI参与任务，<br>让教师掌握判断。</h3><p class="section-lede">从“给我一个答案”转向<strong>定义任务、组织材料、安排分工与检验结果</strong>。教师的学科知识和教学经验，是人机协同的起点。</p><div class="split"><section class="editorial"><h3>从模型，到智能体，再到协同</h3><p>大模型提供理解、生成和推理等能力；智能体围绕任务，结合资料、工具和执行步骤开展工作。</p><p>教师设定目标和标准，决定哪些建议可用，并对教学与研究结论承担责任。</p></section><section class="editorial"><h3>先问自己三个问题</h3><ol><li>希望学生发生什么变化？</li><li>AI依据哪些材料开展工作？</li><li>拿到什么证据，才算任务完成？</li></ol></section></div><div class="table-wrap"><table><thead><tr><th>教研场景</th><th>AI辅助</th><th>教师关键判断</th></tr></thead><tbody>${[
 ['课程设计','整理材料、提出活动备选方案','学情、教学目标、课程难度'],['学习支持','生成案例、分层提示、练习','概念准确性、学生是否理解'],['作业评价','依据量规形成初步反馈','评价公平性、最终成绩'],['文献与选题','检索辅助、归纳与比较','来源真实性、研究价值、证据充分性'],['数据与表达','代码草拟、图表、语言修改','方法适切性、结果解释、学术责任'],['项目指导','拆解任务、比较方案、答辩模拟','真实需求、创新依据、学生贡献']
 ].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="ribbon">目标 → 材料 → 分工 → 产出 → 核验</div><section class="editorial"><h3>备课示例：把需求说清楚</h3><p>“面向首次学习本概念的本科生，依据所附教材节选，设计45分钟教学活动。先列出可能误解，再提出两个活动方案；分别给出学生产出、判断理解程度的问题和教师需核实的内容。”</p><p>核验时回到原始资料；学生数据按规定处理；模型生成的参考文献、数据和结论逐项检查。</p></section>${navBottom('带走方法：用明确目标与证据组织协同','practice','进入应用实践')}`,
practice:()=>`<span class="label">第二部分 · 20分钟</span><h3 class="section-title" style="margin-top:15px">一个教学难点，<br>两种学习支持。</h3><p class="section-lede">围绕同一知识点制作<strong>课程助教智能体＋60秒知识短视频</strong>。视频负责集中解释，智能体承接追问与分层练习，教师观察学习证据并调整设计。</p><div class="split"><section class="editorial"><span class="number">01</span><h3 style="margin-top:18px">课程助教智能体</h3><ol><li><strong>定对象：</strong>课程、学生和学习阶段。</li><li><strong>定任务：</strong>解释概念、引导解题或形成反馈。</li><li><strong>给资料：</strong>课程大纲、教材节选、审核内容。</li><li><strong>设规则：</strong>了解困惑、逐步提示、说明依据。</li><li><strong>做测试：</strong>正常、模糊、资料外、索要答案四类问题。</li></ol></section><section class="editorial"><span class="number">02</span><h3 style="margin-top:18px">60秒知识短视频</h3><ol><li><strong>0—10秒：</strong>问题或常见误解。</li><li><strong>10—35秒：</strong>解释一个核心概念。</li><li><strong>35—50秒：</strong>用一个具体例子说明。</li><li><strong>50—60秒：</strong>给出一道迁移问题。</li></ol><p style="margin-top:15px">学习目标 → 脚本 → 分镜 → 素材与配音 → 字幕剪辑 → 核验。</p></section></div><blockquote>一条视频聚焦一个目标；一次助教对话保留思考空间。</blockquote><section class="editorial"><h3>现场演示的三个检查点</h3><div class="table-wrap"><table><thead><tr><th>检查点</th><th>观察什么</th><th>如何修改</th></tr></thead><tbody><tr><td>依据是否清楚</td><td>回答能否回到课程资料</td><td>补资料、要求标明依据</td></tr><tr><td>教学是否有效</td><td>学生是否解释了自己的思路</td><td>先追问、给提示、安排迁移练习</td></tr><tr><td>边界是否明确</td><td>遇到未知是否坦诚说明</td><td>明确资料不足时的处理规则</td></tr></tbody></table></div></section><div class="form-actions"><button class="button white" data-panel="worksheet">设计我的应用任务 ${arrow}</button><button class="button ghost" data-panel="gallery">查看10个平台</button></div>${navBottom('演示建议：预备原型与视频成品，现场展示关键步骤','integration','进入贯通培养')}`,
integration:()=>`<span class="label">第三部分 · 15分钟</span><h3 class="section-title" style="margin-top:15px">让一个真实问题，<br>连接六个培养环节。</h3><p class="section-lede">“评”贯穿全过程；“赛”依项目适配选择。每个环节都要回答：<strong>学生做什么，教师提供什么支持，用什么证据判断学习发生？</strong></p><div class="cycle-tabs" role="tablist" aria-label="六个培养环节">${LEARNING.map((r,i)=>`<button id="cycle-${i}" role="tab" aria-controls="cycleDetail" aria-selected="${i===0}" tabindex="${i===0?'0':'-1'}" data-cycle="${i}">${r[0]}</button>`).join('')}</div><div class="cycle-detail" id="cycleDetail" role="tabpanel" aria-labelledby="cycle-0"></div><section class="editorial"><h3>教学设计示例：让宝鸡青铜文化被更多人理解</h3><p>以“智能讲解助手＋知识短视频”为共同成果，人文学科负责史料与解释，教育学科负责学习设计，艺术学科负责视觉表达，计算机学科负责系统实现。</p><p class="small-note">这是拟议教学方案，不代表已实施的教学案例，也不预设应用效果。</p></section><div class="ribbon" id="cycleExample"></div><section class="editorial"><h3>怎样从实践形成教研问题？</h3><p>使用智能体和短视频后，学生的理解、迁移或自主学习是否发生变化？先定义观察指标和收集方式，再用实际证据回答。</p><p>作品完成度、学生能力和个人贡献分别评价；不能仅凭满意度或生成速度推断学习效果。</p></section>${navBottom('知识学习 → 问题探究 → 成果应用 → 评价改进','worksheet','制定我的行动计划')}`,
gallery:()=>`<h3 class="section-title">从学科需求出发，<br>让教研构想成为应用。</h3><p class="section-lede">10个平台，9项独立开发、1项指导开发。按学院／单位分类，点击截图查看原图与项目入口。</p><div class="filters" role="group" aria-label="按学院或单位筛选">${['全部',...new Set(PROJECTS.map(p=>p.category))].map((x,i)=>`<button class="filter" data-filter="${x}" aria-pressed="${i===0}">${x}</button>`).join('')}</div><div class="project-grid" id="projectGrid"></div><p class="small-note" style="margin-top:27px">项目名称、分类与建设方式依据作者提供的清单。截图采集于2026-10-19，为公开首页或登录页，未登录平台。截图展示界面，不作为教学成效的验证证据。</p>`,
worksheet:()=>`<h3 class="section-title">先把一个问题，<br>定义成可执行的任务。</h3><p class="section-lede">填入自己的课程情境，形成可复制的智能体任务卡、视频分镜或贯通项目工作单。这是可编辑的结构化模板，内容仅在当前浏览器中处理。</p><form id="taskForm"><div class="form-grid"><label class="field">课程或学科<input name="course" placeholder="例如：大学物理 / 中国古代文学" maxlength="80" required></label><label class="field">学生与阶段<input name="learner" placeholder="例如：本科一年级，初次学习" maxlength="100" required></label><label class="field full">一个具体难点<textarea name="problem" placeholder="例如：学生能复述定义，但难以解释真实情境中的现象" maxlength="600" required></textarea></label><label class="field">希望形成的成果<select name="kind"><option value="agent">课程助教智能体任务卡</option><option value="video">60秒知识短视频分镜</option><option value="cycle">六环贯通项目工作单</option></select></label><label class="field">可提供的资料<input name="material" placeholder="例如：教材第3章、案例、课程量规" maxlength="200"></label></div><div class="form-actions"><button class="button red" type="submit">生成工作单 ${arrow}</button></div></form><label class="field" for="taskOutput">可编辑工作单<textarea class="output" id="taskOutput" placeholder="填写上方课程情境后，点击“生成工作单”。"></textarea></label><div class="form-actions"><button class="button ghost" id="copyTask">复制工作单</button><button class="button ghost" id="downloadTask">下载TXT</button></div><section class="editorial"><h3>新进教师的“四个一”</h3><div class="checklist"><label class="check-item"><input type="checkbox">选定一个反复出现的教学难点。</label><label class="check-item"><input type="checkbox">做出一个范围明确的智能体原型。</label><label class="check-item"><input type="checkbox">制作一条围绕同一难点的短视频。</label><label class="check-item"><input type="checkbox">收集一轮学生反馈和学习证据。</label></div><p class="small-note">勾选与输入仅在当前页面有效；需要保存时请下载工作单。工作单不会自动创建或部署智能体。</p></section>`,
contact:()=>`<div class="contact"><h3 class="section-title">作者联系</h3><div class="contact-line"><div><small>邮箱</small><a href="mailto:bjwlxy@qq.com">bjwlxy@qq.com</a></div><button class="button ghost" data-copy="bjwlxy@qq.com">复制邮箱</button></div><div class="contact-line"><div><small>微信号</small><strong>419944189</strong></div><button class="button ghost" data-copy="419944189">复制微信号</button></div></div>`
};
const panelNames={outline:'60分钟讲座大纲',collaboration:'人机协同与教师教研',practice:'智能体与短视频实践',integration:'教、学、研、赛、用、评',gallery:'智能体平台作品墙',worksheet:'实践工作单',contact:'作者联系'};
const contentDialog=$('#contentDialog'), projectDialog=$('#projectDialog');
let currentPanel='', savedTask=null, galleryPaused=false, userPaused=false, toastTimer;
function closeMenu(){ $('#navlinks').classList.remove('open');$('#menuToggle').setAttribute('aria-expanded','false');$('#menuToggle').setAttribute('aria-label','打开导航菜单'); }
function openPanel(id){if(!templates[id])return;closeMenu();currentPanel=id;$('#panelTitle').textContent=panelNames[id];$('#panelContent').innerHTML=templates[id]();$('#panelContent').scrollTop=0;if(!contentDialog.open)contentDialog.showModal();if(id==='gallery')renderProjects('全部');if(id==='integration')setCycle(0);if(id==='worksheet'&&savedTask){const form=$('#taskForm');for(const [k,v]of Object.entries(savedTask.values))form.elements[k].value=v;$('#taskOutput').value=savedTask.output;}$('#closePanel').focus();}
function renderProjects(filter){$('#projectGrid').innerHTML=PROJECTS.filter(p=>filter==='全部'||p.category===filter).map(p=>`<article class="project-card"><button class="project-shot" style="background-image:url('${p.image}')" data-project="${p.key}" aria-label="查看${p.name}截图与详情"></button><div class="project-meta"><span>${p.category} · ${p.topic}</span><span class="${p.build==='指导开发'?'guided':''}">${p.build}</span></div><h3><a href="${p.url}" target="_blank" rel="noopener noreferrer">${p.name}<span aria-hidden="true">↗</span></a></h3><p>${p.status}</p><a class="domain" href="${p.url}" target="_blank" rel="noopener noreferrer">${p.url.replace('https://','')}</a></article>`).join('');}
function openProject(key){const p=PROJECTS.find(x=>x.key===key);if(!p)return;closeMenu();$('#projectTitle').textContent=p.name;$('#projectContent').innerHTML=`<div class="project-large" role="img" aria-label="${p.name}的${p.status}" style="background-image:url('${p.image}')"></div><div class="project-meta"><span>${p.category} · ${p.topic}</span><span>${p.build}</span></div><h3 class="section-title" style="font-size:31px">${p.name}</h3><p class="section-lede">${p.status}</p><div class="project-links"><a class="button red" href="${p.url}" target="_blank" rel="noopener noreferrer">访问平台 ${arrow}</a><a class="domain" href="${p.url}" target="_blank" rel="noopener noreferrer">${p.url}</a></div><p class="small-note" style="margin-top:24px">真实页面截图 · 2026-10-19 · 公开入口</p>`;projectDialog.showModal();}
function setCycle(i){const r=LEARNING[i];$$('[data-cycle]').forEach((b,j)=>{b.setAttribute('aria-selected',String(j===i));b.tabIndex=j===i?0:-1;});$('#cycleDetail').setAttribute('aria-labelledby','cycle-'+i);$('#cycleDetail').innerHTML=`<h3>${r[0]} · ${r[1]}</h3><p>${r[2]}</p><p class="evidence">学习证据：${r[3]}</p>`;$('#cycleExample').textContent='青铜文化项目 · '+r[4];}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2400);}
async function copyText(text,area){if(!text.trim()){toast('请先生成或填写工作单');return;}try{if(!navigator.clipboard)throw new Error('unavailable');await navigator.clipboard.writeText(text);toast('已复制');}catch{let temp=area;if(!temp){temp=document.createElement('textarea');temp.value=text;temp.style.position='fixed';temp.style.opacity='0';(contentDialog.open?$('#panelContent'):document.body).append(temp);}temp.focus();temp.select();let ok=false;try{ok=document.execCommand('copy');}catch{}if(temp!==area)temp.remove();toast(ok?'已复制':area?'已选中文本，请手动复制':'请长按上方内容复制');}}
function rememberTask(){const form=$('#taskForm');if(form)savedTask={values:Object.fromEntries(new FormData(form)),output:$('#taskOutput').value};}
document.addEventListener('click',e=>{const b=e.target.closest('[data-panel]');if(b){rememberTask();openPanel(b.dataset.panel);return;}const p=e.target.closest('[data-project]');if(p){openProject(p.dataset.project);return;}const f=e.target.closest('[data-filter]');if(f){$$('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===f)));renderProjects(f.dataset.filter);return;}const c=e.target.closest('[data-cycle]');if(c){setCycle(Number(c.dataset.cycle));return;}const copy=e.target.closest('[data-copy]');if(copy)copyText(copy.dataset.copy);if(!e.target.closest('.topbar'))closeMenu();});
$('#menuToggle').addEventListener('click',()=>{const open=$('#navlinks').classList.toggle('open');$('#menuToggle').setAttribute('aria-expanded',String(open));$('#menuToggle').setAttribute('aria-label',open?'关闭导航菜单':'打开导航菜单');});
$('#promptPill').addEventListener('click',()=>openPanel('worksheet'));
$('#closePanel').addEventListener('click',()=>{rememberTask();contentDialog.close();});$('#closeProject').addEventListener('click',()=>projectDialog.close());
contentDialog.addEventListener('cancel',rememberTask);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();if(e.target.matches('[data-cycle]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const old=Number(e.target.dataset.cycle);const i=e.key==='Home'?0:e.key==='End'?5:(old+(e.key==='ArrowRight'?1:5))%6;setCycle(i);$('#cycle-'+i).focus();}});
for(const d of [contentDialog,projectDialog])d.addEventListener('click',e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){if(d===contentDialog)rememberTask();d.close();}});
document.addEventListener('submit',e=>{if(e.target.id!=='taskForm')return;e.preventDefault();const v=Object.fromEntries(new FormData(e.target));const head=`课程：${v.course}\n对象：${v.learner}\n教学难点：${v.problem}\n依据材料：${v.material||'【补充教材节选、案例与评价量规】'}\n\n`;const outputs={agent:`【课程助教智能体任务卡】\n\n${head}一、学习目标\n学生能够解释上述难点，并将概念迁移到一个新情境。请按课程要求补充可观察指标。\n\n二、角色与任务\n作为课程助教，先询问学生已有理解和具体困惑；一次处理一个问题，逐步提示，鼓励学生解释依据。\n\n三、资料与边界\n优先依据提供的课程材料；回答标明材料位置。材料不足时明确说明，请教师复核。不得编造引文、数据或实验结果。\n\n四、交互流程\n了解困惑 → 诊断理解 → 提供提示 → 学生解释 → 迁移练习 → 教师反馈。\n\n五、测试清单\n□ 正常问题：是否准确，依据是否可查？\n□ 模糊问题：是否先澄清？\n□ 资料外问题：是否说明不足？\n□ 索要作业答案：是否引导思考？\n\n六、验收证据\n保存测试对话、教师复核记录与学生解释。根据真实证据修改规则。`,video:`【60秒知识短视频分镜】\n\n${head}0—10秒｜提出问题\n用一句话描述本难点中的常见误解。【填写学生熟悉的情境】\n画面：问题文字＋情境示意。\n\n10—35秒｜解释概念\n依据课程材料说明关键关系，限制为一个核心知识点。【填写准确解释与依据位置】\n画面：逐步呈现概念关系，字幕与配音一致。\n\n35—50秒｜具体例子\n用一个能够检验解释的例子。【填写例子并由教师核实】\n画面：例子、关键步骤和必要标注。\n\n50—60秒｜迁移问题\n更换一个条件，请学生解释会发生什么，以及依据是什么。【填写问题】\n画面：迁移问题，保留思考时间。\n\n核验\n□ 一个学习目标 □ 概念与例子准确 □ 素材使用合规\n□ 字幕清晰 □ 配音可听 □ 迁移问题能检查理解\n\n后续证据\n收集学生对迁移问题的解释，判断是否仍存在误解。`,cycle:`【六环贯通项目工作单】\n\n${head}共同成果\n围绕本难点制作一个可试用的学习支持作品。【补充具体成果】\n\n教｜明确目标、任务与质量标准。\n证据：课程目标、任务书、评价量规。\n\n学｜安排资料学习、合作探索与解释练习。\n证据：学习记录、问题清单、阶段作品。\n\n研｜查证资料、比较方案，定义需要回答的问题。\n证据：来源记录、方案比较与分析过程。\n\n赛｜评估是否有适配赛事，按实际规则整理成果。\n证据：项目报告与答辩材料；不适配则跳过。\n\n用｜在真实或受控场景试用，记录可用性问题。\n证据：试用记录、用户反馈与修改依据。\n\n评｜全过程结合自评、互评和教师评价。\n分别观察作品质量、学习能力与个人贡献。\n\n研究问题\n应用之后，学生的解释与迁移表现是否发生变化？\n【先定义指标、收集方式与比较方案，再依据真实证据作答】`};$('#taskOutput').value=outputs[v.kind];rememberTask();toast('工作单已生成，可编辑、复制或下载');});
document.addEventListener('click',e=>{if(e.target.closest('#copyTask'))copyText($('#taskOutput').value,$('#taskOutput'));if(e.target.closest('#downloadTask')){const text=$('#taskOutput').value;if(!text.trim()){toast('请先生成或填写工作单');return;}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}));a.download='SI教研实践工作单.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已下载工作单');}});
// All gallery cards remain upright. Motion changes only left, top, width and height.
const LEFT=[[853,945,524,623],[743,853,520,629],[597,743,495,646],[432,597,443,694],[245,432,371,768],[56,245,269,868],[-150,56,187,960],[-400,-194,187,960],[-650,-444,187,960],[-900,-694,187,960],[-1150,-944,187,960]];
const RIGHT=[[945,1067,530,619],[1067,1177,525,624],[1177,1323,497,647],[1323,1489,450,695],[1489,1677,386,773],[1677,1864,307,837],[1864,2070,182,945],[2114,2320,182,945],[2364,2570,182,945],[2614,2820,182,945],[2864,3070,182,945]];
const leftSequence=[8,3,2,0,4,7,1,6,5,9],rightSequence=[7,9,4,8,5,2,3,0,6,1];
let birth=0;
function makeWall(parent,slots,seq){return Array.from({length:11},(_,i)=>{const el=document.createElement('button');el.type='button';el.className='flow-card';el.tabIndex=-1;el.setAttribute('aria-hidden','true');const p=PROJECTS[seq[i%seq.length]];el.style.backgroundImage=`url('${p.image}')`;el.dataset.project=p.key;el.innerHTML=`<span>${p.name}</span>`;parent.append(el);return{el,distance:i,slots,seq};});}
const walls=[...makeWall($('#leftWall'),LEFT,leftSequence),...makeWall($('#rightWall'),RIGHT,rightSequence)];
function placeCard(card){const {distance:d,slots,el}=card;const i=Math.min(9,Math.floor(d)),f=Math.min(1,d-i);const a=slots[i],b=slots[i+1];const r=a.map((n,j)=>n+(b[j]-n)*f);el.style.left=r[0]+'px';el.style.top=r[2]+'px';el.style.width=(r[1]-r[0])+'px';el.style.height=(r[3]-r[2])+'px';el.style.opacity=d<.65?String(.42+d*.75):'1';}
walls.forEach(placeCard);
const media=matchMedia('(prefers-reduced-motion: reduce)');let reduced=media.matches;
function resize(){const w=innerWidth,h=innerHeight,s=Math.max(w/1920,h/1200);document.documentElement.style.setProperty('--s',s);document.documentElement.style.setProperty('--dy',((h-1200*s)/2)+'px');}
resize();addEventListener('resize',resize);
$('#art').addEventListener('pointerenter',()=>galleryPaused=true);$('#art').addEventListener('pointerleave',()=>galleryPaused=false);
$('#motionToggle').addEventListener('click',()=>{userPaused=!userPaused;$('#motionToggle').textContent=userPaused?'继续动态':'暂停动态';$('#motionToggle').setAttribute('aria-pressed',String(userPaused));});
function reducedChanged(){reduced=media.matches;if(reduced){wordTime=0;typeTime=0;$('#promptText').textContent='从一个教学问题开始';$('#promptText').style.opacity='1';marqueeX=0;$('#marqueeTrack').style.transform='translateX(0)';walls.forEach((c,i)=>{c.distance=i%11;placeCard(c);});drawWord('人机协同',1);}}
media.addEventListener('change',reducedChanged);
const wordCanvas=$('#wordCanvas'),wc=wordCanvas.getContext('2d'),off=document.createElement('canvas');off.width=740;off.height=106;const oc=off.getContext('2d');const mosaic=document.createElement('canvas'),mc=mosaic.getContext('2d');
function drawWord(word,block){oc.clearRect(0,0,740,106);oc.fillStyle='#fbfbf9';oc.textAlign='center';oc.textBaseline='middle';oc.font='400 65px "Times New Roman","SimSun",serif';oc.fillText(word,370,57);wc.clearRect(0,0,740,106);if(block<=1){wc.drawImage(off,0,0);return;}mosaic.width=Math.max(1,Math.round(740/(block*2)));mosaic.height=Math.max(1,Math.round(106/(block*2)));mc.clearRect(0,0,mosaic.width,mosaic.height);mc.drawImage(off,0,0,mosaic.width,mosaic.height);wc.imageSmoothingEnabled=false;wc.drawImage(mosaic,0,0,740,106);}
drawWord('人机协同',1);
const words=['人机协同','智能体实践','贯通培养','教研创新'];const prompts=['为我的课程，设计一个有边界的助教智能体…','把一个教学难点，讲成60秒知识短视频…','围绕一个真实问题，连接教、学、研、赛、用、评…','从一轮学生反馈，找到下一步教研问题…'];
let previous=0,wordTime=0,typeTime=0,marqueeX=0,lastWord='',lastBlock=-1,lastPrompt='',lastOpacity='';
function frame(now){const dt=previous?Math.min(.1,(now-previous)/1000):0;previous=now;const stopped=reduced||userPaused||contentDialog.open||projectDialog.open||document.hidden;if(!stopped){if(!galleryPaused){for(const c of walls){c.distance+=dt/.87;if(c.distance>=11){c.distance-=11;const p=PROJECTS[c.seq[(birth++)%c.seq.length]];c.el.style.backgroundImage=`url('${p.image}')`;c.el.dataset.project=p.key;c.el.firstElementChild.textContent=p.name;}placeCard(c);}}
wordTime+=dt;const wi=Math.floor(wordTime/2)%words.length,t=wordTime%2;let word=words[wi],block=1;if(t>=1.4){const q=(t-1.4)/.6;block=1+12*Math.sin(q*Math.PI);if(q>=.5)word=words[(wi+1)%words.length];}block=Math.round(block);if(word!==lastWord||block!==lastBlock){drawWord(word,block);lastWord=word;lastBlock=block;}
typeTime+=dt;let time=typeTime,pi=0;const introHold=1.6;if(time<introHold){if(lastPrompt!=='从一个教学问题开始'){$('#promptText').textContent='从一个教学问题开始';lastPrompt='从一个教学问题开始';}}else{time-=introHold;const full=prompts.reduce((sum,p)=>sum+p.length*.026+2.37,0);time%=full;while(time>prompts[pi].length*.026+2.37){time-=prompts[pi].length*.026+2.37;pi=(pi+1)%prompts.length;}const typing=prompts[pi].length*.026;const text=prompts[pi].slice(0,Math.min(prompts[pi].length,Math.floor(time/.026)));const opacity=time>typing+1.6?String(Math.max(0,1-(time-typing-1.6)/.27)):'1';if(text!==lastPrompt){$('#promptText').textContent=text||' ';lastPrompt=text;}if(opacity!==lastOpacity){$('#promptText').style.opacity=opacity;lastOpacity=opacity;}}
const span=$('.logo-set').getBoundingClientRect().width;if(span){marqueeX=(marqueeX+dt*72)%span;$('#marqueeTrack').style.transform=`translateX(${-marqueeX}px)`;}}
requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
